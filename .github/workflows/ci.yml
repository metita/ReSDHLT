# Compile check on every push: the tools on Windows and Linux, the GUI on Windows.
# The release workflow builds the shipped binaries; this one only has to say
# fast whether the code still compiles and passes lint.
name: build

on:
  push:
  pull_request:

jobs:
  gui:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # Same toolchain as the release job, so both share the dependency cache.
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    # Compiled dependencies survive between runs, so a push that only touches
    # the GUI's own code does not rebuild egui from scratch. A tag can only
    # read caches saved on main, which is why this job also builds the release
    # profile with the release job's flags: the tag then finds it warm.
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: gui
        shared-key: gui

    - name: Check formatting
      working-directory: gui
      run: cargo fmt --all -- --check

    - name: Lint all GUI targets
      working-directory: gui
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: Build the release GUI
      working-directory: gui
      env:
        CARGO_PROFILE_RELEASE_DEBUG: "1"
      run: cargo build --locked --release

  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Report every platform, not just the first one that fails.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: >
        cmake -B ${{ github.workspace }}/build
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=Release
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config Release --parallel
