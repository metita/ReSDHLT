[package]
name = "resdhlt-gui"
version = "0.17.0"
edition = "2021"
description = "Map compiler front-end for ReSDHLT"
license = "GPL-2.0-or-later"

[dependencies]
# Versions are pinned exactly on purpose. eframe changed the signature of
# run_native's app creator in 0.29 (it started returning a Result), so a loose
# requirement like "0.28" could silently resolve to something incompatible
# later. Pin it and the code stays buildable.
eframe = { version = "=0.28.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
] }
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
egui = "=0.28.1"
fs2 = "=0.4.3"
rfd = "=0.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = 2
strip = true

# Windows: build without a console window attached.
[[bin]]
name = "resdhlt-gui"
path = "src/main.rs"

[[bin]]
name = "resdhlt-release-signer"
path = "src/release_signer.rs"


